name: GitHub AI Repo Tracker

on:
  schedule:
    - cron: '0 12 * * *'  # 7:00 AM Toronto (EST), every day
  workflow_dispatch:

concurrency:
  group: gh-repo-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install requests

      - name: Track new and trending AI repos
        run: python scripts/track_github_repos.py

      - name: Commit results
        run: |
          git config user.email "yc-intel-agent@noreply.local"
          git config user.name "YC Intelligence Agent"
          git add data/github-repos/
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "intel: github repo tracker $(date -u +%Y-%m-%d)"
          git push
