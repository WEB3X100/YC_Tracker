name: YC Daily Intelligence Brief

on:
  schedule:
    - cron: '0 12 * * 1-5'  # 7:00 AM Toronto (EST) weekdays
  workflow_dispatch:

concurrency:
  group: yc-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: pip install -r scripts/requirements.txt
      - run: npm install -g @anthropic-ai/claude-code

      - name: Generate briefs for all active niches
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/generate_brief.py daily

      - name: Commit results
        run: |
          git config user.email "yc-intel-agent@noreply.local"
          git config user.name "YC Intelligence Agent"
          git add data/
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "intel: daily briefs $(date -u +%Y-%m-%d)"
          git push
